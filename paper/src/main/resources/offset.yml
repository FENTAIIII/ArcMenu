# Global screen placement. Values apply to every menu opened in that mode,
# including the editor because it opens through mouse mode.
#
# distance: eye-to-screen distance in blocks. ArcMenu preserves apparent size.
# offset: additional screen-local translation in blocks.
#   x: positive moves right
#   y: positive moves up
#   z: positive moves toward the viewer
touch:
  distance: 0.65
  offset:
    x: 0.0
    y: 0.0
    z: 0.0

mouse:
  distance: 0.65
  offset:
    x: 0.0
    y: 0.0
    z: 0.0
